<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trivia Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE9FF;--spot:rgba(255,255,255,.95);--surface:#FFFFFF;--surface2:#F3F1FF;
  --ink:#191552;--muted:#55518D;--line:#CBC5F2;--rail:#2A2570;
  --ok:#0F7A4D;--okbg:#D8F4E6;--bad:#B8262B;--badbg:#FBDFE0;--star:#F0A900;
  --display:'Bungee','Impact','Arial Black',system-ui,sans-serif;
  --body:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13113B;--spot:rgba(88,80,220,.38);--surface:#1E1B57;--surface2:#26226E;
    --ink:#F3F1FF;--muted:#AEA9E8;--line:#3B3792;--rail:#5650B8;
    --ok:#4BE0A0;--okbg:rgba(75,224,160,.16);--bad:#FF7B80;--badbg:rgba(255,123,128,.16);--star:#FFC629;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13113B;--spot:rgba(88,80,220,.38);--surface:#1E1B57;--surface2:#26226E;
  --ink:#F3F1FF;--muted:#AEA9E8;--line:#3B3792;--rail:#5650B8;
  --ok:#4BE0A0;--okbg:rgba(75,224,160,.16);--bad:#FF7B80;--badbg:rgba(255,123,128,.16);--star:#FFC629;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:400 17px/1.5 var(--body);
  background:radial-gradient(900px 420px at 50% -80px,var(--spot),transparent 70%) no-repeat,var(--bg)}
#app{max-width:760px;margin:0 auto;padding:20px 16px 56px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-block;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:800;padding:14px 26px;font-size:17px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn:hover{opacity:.9}
.ghost,.link{background:none;border:0;padding:8px 4px;color:var(--muted);font-weight:600}
.ghost:hover,.link:hover{color:var(--ink)}
.link{text-decoration:underline;text-underline-offset:3px;font-size:15px}

/* Home */
.title{font-family:var(--display);font-weight:400;font-size:clamp(46px,12vw,96px);line-height:.95;margin:28px 0 16px}
.strip{display:flex;gap:6px;max-width:340px;margin-bottom:18px}
.strip i{flex:1;height:14px;border-radius:7px;background:var(--c)}
.lede{margin:0 0 24px;color:var(--muted);font-size:19px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:grid;gap:6px;text-align:left;padding:18px 16px;background:var(--surface);border:2px solid var(--line);border-radius:16px;transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--ink);transform:translateY(-2px)}
.tile .ico{font-size:34px;line-height:1}
.tile .tname{font-weight:800;font-size:19px;line-height:1.2}
.tile .tstars{color:var(--muted);font-size:14px}
.source{margin-top:30px;padding-top:20px;border-top:2px solid var(--line)}
.source .slabel{display:block;font-weight:800;margin-bottom:8px}
.seg{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;margin:0 6px 6px 0}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg:disabled{opacity:.45;border-color:var(--line)}
.shint{margin:6px 0 0;color:var(--muted);font-size:15px}

/* Levels + ladder */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.lvhead{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,42px);line-height:1.05;margin:10px 0 6px}
.sub{margin:0 0 26px;color:var(--muted)}
.ladder{position:relative;display:flex;flex-direction:column;gap:12px;padding:0 18px;margin:18px 0 8px}
.ladder::before,.ladder::after{content:"";position:absolute;top:-14px;bottom:-14px;width:12px;border-radius:8px;background:var(--rail)}
.ladder::before{left:0}.ladder::after{right:0}
.rung{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;
  width:calc(100% + 12px);margin-left:-6px;padding:16px 20px;border:0;border-radius:14px;
  background:var(--lv);color:var(--lv-fg);text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .1s,box-shadow .1s}
.rung:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.3)}
.rung:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.rname{font-family:var(--display);font-size:clamp(20px,5.2vw,28px);line-height:1.1}
.rmeta{font-size:15px;opacity:.92}
.rright{grid-row:1/3;grid-column:2;text-align:right;display:grid;gap:2px}
.rstars{font-size:24px;letter-spacing:2px;line-height:1}
.rbest{font-size:14px;font-weight:600}

/* Loading */
.loading{text-align:center;padding-top:40px}
.ltitle{font-family:var(--display);font-weight:400;font-size:clamp(26px,6vw,36px);margin:0 0 22px;line-height:1.1}
.climb{display:flex;flex-direction:column;gap:8px;width:220px;margin:0 auto 22px}
.climb i{display:block;height:16px;border-radius:8px;background:var(--c);opacity:.9}
@media(prefers-reduced-motion:no-preference){
  .climb i{opacity:.2;animation:rung 1.6s infinite}
  @keyframes rung{0%,60%,100%{opacity:.2}30%{opacity:1}}
}
.lsub{color:var(--muted);margin:0 auto 22px;max-width:460px}

/* Play */
.playbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.chip{background:var(--lv);color:var(--lv-fg);border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;text-align:center}
.score{font-family:var(--display);font-size:24px;min-width:4.5ch;text-align:right}
.dots{display:flex;gap:6px;margin-bottom:14px}
.dot{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.no{background:var(--bad)}.dot.cur{background:var(--lv)}.dot.void{background:var(--muted);opacity:.5}
.timer{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.tbar{flex:1;height:14px;border-radius:999px;background:var(--surface2);border:2px solid var(--line);overflow:hidden}
.tfill{height:100%;background:var(--lv);transform-origin:left;border-radius:999px}
.timer.low .tfill{background:var(--bad)}
.tnum{font-family:var(--display);font-size:26px;min-width:2.2ch;text-align:right}
.qcard{background:var(--surface);border-radius:18px;border-top:8px solid var(--lv);padding:20px 22px 24px}
.qmeta{color:var(--muted);font-size:14px;margin-bottom:8px}
.qtext{margin:0;font-weight:600;font-size:clamp(21px,4.8vw,28px);line-height:1.25}
.note{background:var(--surface2);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:15px;color:var(--muted)}
.answers{display:grid;gap:10px;margin-top:14px}
@media(min-width:640px){.answers{grid-template-columns:1fr 1fr}}
.ans{display:flex;align-items:center;gap:12px;text-align:left;min-height:64px;padding:12px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-weight:600;font-size:18px}
.ans:hover:not(:disabled){border-color:var(--ink)}
.key{flex:none;width:32px;height:32px;border-radius:8px;background:var(--surface2);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:14px}
.atext{flex:1}
.mark{font-weight:800;font-size:20px}
.ans.correct{background:var(--okbg);border-color:var(--ok)}
.ans.correct .mark{color:var(--ok)}
.ans.wrong{background:var(--badbg);border-color:var(--bad)}
.ans.wrong .mark{color:var(--bad)}
.ans.dim{opacity:.55}
.ans.gone{opacity:.28;text-decoration:line-through}
.tools{display:flex;justify-content:flex-start;align-items:center;gap:12px;margin-top:14px}
.life{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:8px 18px;font-weight:800}
.life:disabled{opacity:.4;border-color:var(--line)}
.hint{color:var(--muted);font-size:14px}
.fb{margin-top:16px;padding:18px 20px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.verdict{font-family:var(--display);font-size:24px;line-height:1.15}
.fb p{margin:8px 0 0}
.fbrow{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:16px}

/* Results */
.results{text-align:center;padding-top:16px}
.rank{font-family:var(--display);font-size:clamp(28px,7vw,42px);line-height:1.1;margin:6px 0 4px}
.bigscore{font-family:var(--display);font-size:clamp(56px,16vw,96px);line-height:1;margin:10px 0}
.bigstars{font-size:52px;letter-spacing:6px;color:var(--star);line-height:1}
.bigstars .off{color:var(--line)}
.rsum{color:var(--muted);margin:8px 0 4px}
.badge{display:inline-block;background:var(--lv);color:var(--lv-fg);font-weight:800;border-radius:999px;padding:4px 14px;margin:8px 0}
.rbtns{display:flex;flex-direction:column;gap:10px;max-width:340px;margin:24px auto 0}
.review{text-align:left;margin-top:28px;background:var(--surface);border-radius:16px;padding:8px 18px}
.review summary{cursor:pointer;font-weight:800;padding:10px 0}
.review ol{margin:0;padding:0 0 12px;list-style:none;display:grid;gap:12px}
.review li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:15px}
.review .rq{font-weight:600}
.review .ra{color:var(--muted)}
.rv-ok{color:var(--ok);font-weight:800}.rv-no{color:var(--bad);font-weight:800}
</style>
</head>

  var dots=r.qs.map(function(_,i){var x=r.res[i],c='';if(x)c=x.voided?'void':(x.ok?'ok':'no');else if(i===r.i)c='cur';return '<i class="dot '+c+'"></i>';}).join('');
  var opts=q.opts.map(function(o,i){
    var cls='ans',mark='',sr='',gone=q.removed.indexOf(i)>-1,dis=reveal||gone;
    if(gone)cls+=' gone';
    if(reveal){
      if(i===q.ci){cls+=' correct';mark='<span class="mark" aria-hidden="true">✓</span>';sr='<span class="sr"> Correct answer</span>';}
      else if(res&&res.chosen===i){cls+=' wrong';mark='<span class="mark" aria-hidden="true">✗</span>';sr='<span class="sr"> Your answer, incorrect</span>';}
      else cls+=' dim';
    }
    return '<button class="'+cls+'" data-a="ans" data-i="'+i+'"'+(dis?' disabled':'')+'><span class="key" aria-hidden="true">'+(i+1)+'</span><span class="atext">'+esc(o)+sr+'</span>'+mark+'</button>';
  }).join('');
  var fb='';
  if(reveal){
    var head,cls='';
    if(res.voided){head='Question removed';}
    else if(res.ok){head='Correct! +'+fmt(res.pts);cls='ok';}
    else{head=res.timeout?"Time's up":'Not quite';cls='no';}
    var body='';
    if(res.voided)body+='<p>This question will not count toward your score.</p>';
    else if(!res.ok)body+='<p>The answer: <strong>'+esc(q.opts[q.ci])+'</strong></p>';
    if(q.fact&&!res.voided)body+='<p>'+esc(q.fact)+'</p>';
    var lastQ=r.i>=r.qs.length-1;
    fb='<div class="fb '+cls+'" id="fb" role="status"><div class="verdict">'+esc(head)+'</div>'+body+
      '<div class="fbrow">'+(res.voided?'<span></span>':'<button class="link" data-a="report">Report a bad question</button>')+
      '<button class="btn" data-a="next" data-focus>'+(lastQ?'See results':'Next question')+'</button></div></div>';
  }
  var lifeLabel=r.life?'50/50':'50/50 used';
  return '<section style="'+lvStyle(L)+'">'+
   '<div class="playbar"><button class="ghost" data-a="quit">Quit</button><div class="chip">'+esc(L.name)+', '+esc(C.name)+'</div><div class="score" aria-label="Score">'+fmt(r.score)+'</div></div>'+
   (r.note?'<p class="note">'+esc(r.note)+'</p>':'')+
   '<div class="dots" aria-hidden="true">'+dots+'</div>'+
   '<div class="timer'+(left<=5&&!reveal?' low':'')+'" id="timer" aria-hidden="true"><div class="tbar"><div class="tfill" id="tfill" style="transform:scaleX('+(left/L.time)+')"></div></div><div class="tnum" id="tnum">'+Math.ceil(left)+'</div></div>'+
   '<article class="qcard"><div class="qmeta">Question '+(r.i+1)+' of '+r.qs.length+', '+(q.src==='ai'?'written by Claude':'built-in question')+'</div>'+
   '<h1 class="qtext" tabindex="-1"'+(reveal?'':' data-focus')+'>'+esc(q.q)+'</h1></article>'+
   '<div class="answers">'+opts+'</div>'+
   '<div class="tools"><button class="life" data-a="life"'+((r.life&&!reveal)?'':' disabled')+'>'+lifeLabel+'</button><span class="hint">Keys: 1 to 4 to answer, F for 50/50</span></div>'+
   fb+'</section>';
}

function vResults(){
  var r=S.round,f=r.final,L=r.lvl,C=r.cat;
  var big=''; for(var i=0;i<3;i++)big+=(i<f.stars?'★':'<span class="off">★</span>');
  var review=r.qs.map(function(q,i){
    var x=r.res[i]||{};
    var mark=x.voided?'–':(x.ok?'<span class="rv-ok">✓</span>':'<span class="rv-no">✗</span>');
    return '<li><span aria-hidden="true">'+mark+'</span><div><div class="rq">'+esc(q.q)+'</div><div class="ra">Answer: '+esc(q.opts[q.ci])+(x.voided?' (removed)':'')+'</div></div></li>';
  }).join('');
  return '<section class="results" style="'+lvStyle(L)+'">'+
   '<p class="rsum">'+esc(L.name)+', '+esc(C.name)+'</p>'+
   '<h1 class="rank" tabindex="-1" data-focus>'+esc(f.rank)+'</h1>'+
   '<div class="bigscore">'+fmt(r.score)+'</div>'+
   '<div class="bigstars" role="img" aria-label="'+f.stars+' of 3 stars">'+big+'</div>'+
   '<p class="rsum">'+r.correct+' of '+f.counted+' correct'+(r.voided?' ('+r.voided+' removed)':'')+'</p>'+
   (f.isBest?'<span class="badge">New best for this level</span>':'')+
   '<div class="rbtns"><button class="btn" data-a="again">Play again</button><button class="btn alt" data-a="levels">Change level</button><button class="btn alt" data-a="home">Change category</button></div>'+
   '<details class="review"><summary>Review your answers</summary><ol>'+review+'</ol></details></section>';
}

/* ---------- render ---------- */
function render(opts){
  opts=opts||{};
  cancelAnimationFrame(raf);
  var fn={home:vHome,levels:vLevels,loading:vLoading,play:vPlay,results:vResults}[S.screen];
  $app.innerHTML=fn();
  var f=$app.querySelector('[data-focus]');
  if(f)f.focus({preventScroll:true});
  if(S.screen==='play'&&S.round.phase==='ask')startTimer();
  if(opts.keep){var fbEl=document.getElementById('fb');if(fbEl)fbEl.scrollIntoView({block:'nearest',behavior:reduced()?'auto':'smooth'});}
  else window.scrollTo(0,0);
}

/* ---------- timer ---------- */
function paintTimer(){
  var r=S.round;if(!r)return;
  var left=Math.max(0,r.lvl.time-r.elapsed);
  var f=document.getElementById('tfill');if(f)f.style.transform='scaleX('+(left/r.lvl.time)+')';
  var n=document.getElementById('tnum');if(n)n.textContent=Math.ceil(left);
  var t=document.getElementById('timer');if(t)t.classList.toggle('low',left<=5);
}
function startTimer(){
  cancelAnimationFrame(raf);
  last=performance.now();
  var tick=function(now){
    var r=S.round;
    if(S.screen!=='play'||!r||r.phase!=='ask')return;
    var dt=Math.min(now-last,250);last=now;
    r.elapsed+=dt/1000;
    paintTimer();
    if(r.elapsed>=r.lvl.time){timeUp();return;}
    raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
}

/* ---------- round building ---------- */
function bankQ(cat,lvl,row,idx){return {q:row[0],c:row[1],w:[row[2],row[3],row[4]],fact:row[5],src:'bank',key:cat.id+'|'+lvl.i+'|'+idx};}
function pickBank(cat,lvl,n,exclude){
  exclude=exclude||[];
  var rows=(BANK[cat.id]&&BANK[cat.id][lvl.i]||[]).map(function(r,i){return bankQ(cat,lvl,r,i);});
  var pool=rows.filter(function(r){return exclude.indexOf(norm(r.q))<0&&store.flagged.indexOf(r.key)<0;});
  var fresh=shuffle(pool.filter(function(r){return store.seenBank.indexOf(r.key)<0;}));
  var out=fresh.slice(0,n);
  if(out.length<n){
    var prefix=cat.id+'|'+lvl.i+'|';
    store.seenBank=store.seenBank.filter(function(k){return k.indexOf(prefix)!==0;});
    var rest=shuffle(pool.filter(function(r){return out.indexOf(r)<0;}));
    out=out.concat(rest.slice(0,n-out.length));
    if(out.length<n){
      rest=shuffle(rows.filter(function(r){return out.indexOf(r)<0;}));
      out=out.concat(rest.slice(0,n-out.length));
    }
  }
  return out;
}

async function genAI(cat,lvl,signal){
  var angles=shuffle(cat.angles.slice()).slice(0,PER_ROUND);
  var avoid=(store.seenAI[cat.id+'|'+lvl.i]||[]).slice(-30);
  var prompt='You are writing one round of a multiple-choice trivia game.\n'+
   'Category: '+cat.name+'\nDifficulty: '+BRIEF[lvl.i]+'\n\n'+
   'Write exactly '+PER_ROUND+' questions. Give each question a different topic angle, in this order:\n'+
   angles.map(function(a,i){return (i+1)+'. '+a;}).join('\n')+'\n\n'+
   'Rules:\n'+
   '- Exactly 1 correct answer and 3 plausible but clearly wrong answers.\n'+
   '- Only use facts you are certain about and that will not change over time. No "current" or "latest" records.\n'+
   '- No trick questions, no "all of the above", and never give away the answer in the question.\n'+
   '- Questions under 25 words. Answers under 7 words each.\n'+
   '- "fact" is one interesting sentence (max 22 words) that adds context to the correct answer.\n'+
   (avoid.length?'- Do not repeat or closely paraphrase these earlier questions:\n'+avoid.map(function(a){return '  * '+a.slice(0,110);}).join('\n')+'\n':'')+
   '\nVariation code (ignore, just makes this request unique): '+Math.random().toString(36).slice(2,9)+'\n\n'+
   'Reply with only a JSON array of '+PER_ROUND+' objects, like:\n'+
   '[{"q":"Question text?","correct":"Right answer","wrong":["Wrong 1","Wrong 2","Wrong 3"],"fact":"One interesting sentence."}]';
  var data=await sampleFn.json(prompt,{
    signal:signal,cache:false,modelTier:lvl.i<=1?'quick':'default',
    onText:function(o){
      var m=String(o.text).match(/"q"\s*:/g),n=m?m.length:0;
      if(S.screen==='loading'&&n!==S.gen.count){
        S.gen.count=n;
        var el=document.getElementById('gencount');
        if(el&&n>0)el.textContent='Writing question '+Math.min(n,PER_ROUND)+' of '+PER_ROUND+'...';
      }
    }
  });
  var arr=Array.isArray(data)?data:(data&&Array.isArray(data.questions)?data.questions:[]);
  var seenN={};avoid.forEach(function(a){seenN[norm(a)]=1;});
  var out=[];
  for(var i=0;i<arr.length&&out.length<PER_ROUND;i++){
    var it=arr[i]||{};
    var q=clean(it.q),c=clean(it.correct);
    var w=Array.isArray(it.wrong)?it.wrong.map(clean).filter(Boolean):[];
    var uniq=[];w.forEach(function(x){if(norm(x)!==norm(c)&&uniq.map(norm).indexOf(norm(x))<0)uniq.push(x);});
    if(!q||!c||uniq.length<3||q.length>260||seenN[norm(q)])continue;
    seenN[norm(q)]=1;
    out.push({q:q,c:c,w:uniq.slice(0,3),fact:clean(it.fact),src:'ai',key:null});
  }
  if(out.length<4)throw {code:'invalid_json'};
  if(out.length<PER_ROUND){out=out.concat(pickBank(cat,lvl,PER_ROUND-out.length,out.map(function(x){return norm(x.q);})));}
  return shuffle(out);
}

function noteFor(e){
  var c=e&&e.code;
  if(c==='cancelled')return '';
  if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){S.aiState='denied';return 'Fresh questions need permission to use Claude, so this round uses the built-in bank.';}
  if(c==='rate_limited')return 'Claude is at its usage limit for now, so this round uses the built-in bank.';
  if(c==='session_expired')return 'Sign in again to get fresh questions. This round uses the built-in bank.';
  return "Couldn't get fresh questions this time, so this round uses the built-in bank.";
}

function prepare(q){
  var opts=shuffle([q.c].concat(q.w));
  return {q:q.q,opts:opts,ci:opts.indexOf(q.c),fact:q.fact,src:q.src,key:q.key,removed:[]};
}

async function startRound(cat,lvl){
  S.cat=cat;S.lvl=lvl;
  var tok=++S.tok;
  var qs=null,note='';
  if(aiOn()){
    S.screen='loading';S.gen={count:0};render();
    await aiPromise;
    if(tok!==S.tok)return;
    if(S.aiState==='ready'&&store.ai){
      ctl=new AbortController();
      try{qs=await genAI(cat,lvl,ctl.signal);}
      catch(e){note=noteFor(e);}
      if(tok!==S.tok)return;
    }
  }
  if(!qs)qs=pickBank(cat,lvl,PER_ROUND);
  /* remember what was used */
  var k=cat.id+'|'+lvl.i;
  qs.forEach(function(q){
    if(q.src==='ai'){var a=store.seenAI[k]=store.seenAI[k]||[];a.push(q.q);if(a.length>40)a.splice(0,a.length-40);}
    else if(q.key&&store.seenBank.indexOf(q.key)<0)store.seenBank.push(q.key);
  });
  save();
  S.round={cat:cat,lvl:lvl,qs:qs.map(prepare),i:0,score:0,correct:0,voided:0,life:true,phase:'ask',elapsed:0,res:[],note:note};
  S.screen='play';render();
}

/* ---------- gameplay ---------- */
function answer(idx){
  var r=S.round;if(!r||r.phase!=='ask')return;
  var q=cur();if(q.removed.indexOf(idx)>-1)return;
  cancelAnimationFrame(raf);
  var frac=Math.max(0,1-r.elapsed/r.lvl.time);
  var ok=idx===q.ci;
  var pts=ok?Math.round((100+50*frac)*r.lvl.mult):0;
  r.res[r.i]={ok:ok,pts:pts,chosen:idx,timeout:false,voided:false};
  if(ok)r.correct++;
  r.score+=pts;r.phase='reveal';render({keep:true});
}
function timeUp(){
  var r=S.round;if(!r||r.phase!=='ask')return;
  cancelAnimationFrame(raf);
  r.res[r.i]={ok:false,pts:0,chosen:null,timeout:true,voided:false};
  r.phase='reveal';render({keep:true});
}
function lifeline(){
  var r=S.round;if(!r||r.phase!=='ask'||!r.life)return;
  var q=cur();
  var wrong=shuffle(q.opts.map(function(_,i){return i;}).filter(function(i){return i!==q.ci&&q.removed.indexOf(i)<0;}));
  q.removed=q.removed.concat(wrong.slice(0,2));r.life=false;
  render({keep:true});
}
function reportQ(){
  var r=S.round,res=r.res[r.i],q=cur();
  if(!res||res.voided)return;
  res.voided=true;r.score-=res.pts;if(res.ok)r.correct--;r.voided++;
  if(q.src==='bank'&&q.key){if(store.flagged.indexOf(q.key)<0)store.flagged.push(q.key);}
  else{var k=r.cat.id+'|'+r.lvl.i;var a=store.seenAI[k]=store.seenAI[k]||[];a.push(q.q);}
  save();render({keep:true});
}
function next(){
  var r=S.round;if(!r||r.phase!=='reveal')return;
  if(r.i>=r.qs.length-1){finish();return;}
  r.i++;r.phase='ask';r.elapsed=0;render();
}
function rankFor(ratio){
  if(ratio>=1)return 'Quiz Legend';
  if(ratio>=0.85)return 'Quiz Master';
  if(ratio>=0.7)return 'Brain Trust';
  if(ratio>=0.5)return 'Table Captain';
  if(ratio>=0.25)return 'Quiz Contender';
  return 'Trivia Rookie';
}
function finish(){
  var r=S.round;
  var counted=r.qs.length-r.voided;
  var ratio=counted>0?r.correct/counted:0;
  var st=counted<=0?0:(ratio>=0.875?3:ratio>=0.75?2:ratio>=0.5?1:0);
  var key=r.cat.id+'|'+r.lvl.i;
  var prev=store.best[key]||{score:0,stars:0};
  var isBest=counted>0&&r.score>prev.score;
  store.best[key]={score:Math.max(prev.score,r.score),stars:Math.max(prev.stars,st)};
  save();
  r.final={counted:counted,ratio:ratio,stars:st,isBest:isBest,rank:counted>0?rankFor(ratio):'No scored questions'};
  S.screen='results';render();
}

/* ---------- events ---------- */
$app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');
  if(!b||b.disabled)return;
  var d=b.dataset;
  switch(d.a){
    case 'cat':S.cat=CATS.filter(function(c){return c.id===d.id;})[0];S.screen='levels';render();break;
    case 'lvl':startRound(S.cat,LEVELS[+d.i]);break;
    case 'home':S.screen='home';render();break;
    case 'levels':S.screen='levels';render();break;
    case 'src':store.ai=(d.v==='ai');save();refreshSource();break;
    case 'ans':answer(+d.i);break;
    case 'life':lifeline();break;
    case 'next':next();break;
    case 'report':reportQ();break;
    case 'quit':cancelAnimationFrame(raf);S.round=null;S.screen='levels';render();break;
    case 'again':startRound(S.cat,S.lvl);break;
    case 'skipai':store.ai=store.ai;if(ctl)ctl.abort();break;
    case 'cancelload':S.tok++;if(ctl)ctl.abort();S.screen='levels';render();break;
  }
});
window.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey||S.screen!=='play'||!S.round)return;
  var r=S.round;
  if(r.phase==='ask'){
    if(e.key>='1'&&e.key<='4'){answer(+e.key-1);}
    else if(e.key==='f'||e.key==='F'){lifeline();}
  }else if(r.phase==='reveal'){
    if(e.key==='Enter'&&document.activeElement===document.body){next();}
  }
});

render();
})();
</script>
